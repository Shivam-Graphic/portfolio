<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio CMS</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0c1220;
      --card: #111827;
      --card2: #0f172a;
      --line: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --blue2: #60a5fa;
      --green: #34d399;
      --red: #f87171;
      --orange: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, -apple-system, sans-serif; }
    button, input, textarea, select { font: inherit; color: inherit; }

    /* Login */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 48px 40px; max-width: 420px; width: 100%; text-align: center; }
    .login-card h1 { font-size: 28px; margin-bottom: 8px; }
    .login-card .sub { color: var(--muted); margin-bottom: 28px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; text-decoration: none; transition: .15s; }
    .btn.primary { background: linear-gradient(100deg, #2563eb, #3b82f6); color: #fff; }
    .btn.primary:hover { filter: brightness(1.1); }
    .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
    .btn.ghost:hover { border-color: #334155; color: var(--text); }
    .btn.danger { background: #7f1d1d; color: #fecaca; }
    .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* Layout */
    .app { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; }
    .side { background: var(--panel); border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; }
    .brand { font-size: 18px; font-weight: 800; padding: 6px 10px 22px; letter-spacing: -.3px; }
    .brand span { color: var(--blue2); }
    .group { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: #64748b; padding: 16px 10px 8px; }
    .nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; color: #94a3b8; padding: 11px 12px; border-radius: 10px; margin: 2px 0; cursor: pointer; transition: .12s; }
    .nav button:hover { background: #111827; color: var(--text); }
    .nav button.active { background: #111827; border-color: #1e293b; color: var(--blue2); }
    .nav .icon { width: 18px; text-align: center; opacity: .8; }
    .side-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); }

    .main { padding: 28px 36px 48px; overflow-y: auto; max-height: 100vh; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
    .topbar h1 { font-size: 24px; font-weight: 700; }
    .topbar .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .top-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 18px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

    /* Forms */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .app { grid-template-columns: 1fr; } .side { display: none; } }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .field input, .field textarea, .field select {
      width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; color: var(--text); outline: none; transition: border .15s;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--blue); }
    .field textarea { min-height: 90px; resize: vertical; }

    /* List items */
    .item { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .item-title { font-weight: 600; font-size: 15px; }
    .item-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .points { margin-top: 8px; }
    .point-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
    .point-row input { flex: 1; }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; }

    .status { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
    .status.saving { color: var(--orange); }

    .level-bar { height: 6px; background: #1e293b; border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .level-fill { height: 100%; background: linear-gradient(90deg, #2563eb, #60a5fa); border-radius: 99px; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; background: #1e293b; color: var(--muted); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const SECTIONS = [
      { id: "profile", path: "content/profile.json", name: "Profile", icon: "👤" },
      { id: "softwares", path: "content/softwares.json", name: "Softwares", icon: "🛠" },
      { id: "experience", path: "content/experience.json", name: "Experience", icon: "💼" },
      { id: "education", path: "content/education.json", name: "Education", icon: "🎓" },
      { id: "categories", path: "content/categories.json", name: "Categories", icon: "🏷" },
      { id: "projects", path: "content/projects.json", name: "Projects", icon: "📁" },
    ];

    let activeId = "profile";
    let rawData = null;   // parsed object/array
    let sha = null;
    let dirty = false;

    const root = document.getElementById("root");

    async function api(url, opts = {}) {
      const res = await fetch(url, { credentials: "include", ...opts });
      if (res.status === 401) { showLogin(); throw new Error("Unauthorized"); }
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || res.statusText);
      return json;
    }

    function showLogin() {
      root.innerHTML = `
        <div class="login-wrap">
          <section class="login-card">
            <h1>Portfolio <span style="color:var(--blue2)">CMS</span></h1>
            <p class="sub">Sign in with GitHub to manage content.</p>
            <a class="btn primary" href="/api/admin/login">Login with GitHub</a>
          </section>
        </div>`;
    }

    function setStatus(msg, type = "") {
      const el = document.getElementById("status");
      if (el) { el.textContent = msg; el.className = "status " + type; }
    }

    async function loadSection(id) {
      activeId = id;
      const sec = SECTIONS.find(s => s.id === id);
      setStatus("Loading...");
      try {
        const res = await api("/api/admin/content?path=" + encodeURIComponent(sec.path));
        rawData = JSON.parse(res.content);
        sha = res.sha;
        dirty = false;
        render();
        setStatus("Ready");
      } catch (e) {
        if (e.message !== "Unauthorized") setStatus(e.message, "error");
      }
    }

    async function saveSection() {
      const sec = SECTIONS.find(s => s.id === activeId);
      setStatus("Publishing...", "saving");
      try {
        const content = JSON.stringify(rawData, null, 2);
        await api("/api/admin/content?path=" + encodeURIComponent(sec.path), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content }),
        });
        dirty = false;
        setStatus("Published successfully!", "success");
      } catch (e) {
        setStatus(e.message || "Save failed", "error");
      }
    }

    function markDirty() { dirty = true; }

    // ─── Renderers ───────────────────────────────────────

    function renderProfile() {
      const d = rawData || {};
      const s = d.socials || {};
      return `
        <div class="card">
          <div class="card-title">Basic Info</div>
          <div class="grid-2">
            <div class="field"><label>Name</label><input data-k="name" value="${esc(d.name)}" /></div>
            <div class="field"><label>Title</label><input data-k="title" value="${esc(d.title)}" /></div>
            <div class="field"><label>Tagline</label><input data-k="tagline" value="${esc(d.tagline)}" /></div>
            <div class="field"><label>Years Experience</label><input data-k="yearsExp" value="${esc(d.yearsExp)}" /></div>
          </div>
          <div class="field"><label>Bio</label><textarea data-k="bio">${esc(d.bio)}</textarea></div>
          <div class="field"><label>Bio 2</label><textarea data-k="bio2">${esc(d.bio2)}</textarea></div>
          <div class="grid-2">
            <div class="field"><label>Photo path</label><input data-k="photo" value="${esc(d.photo)}" /></div>
            <div class="field"><label>Email</label><input data-k="email" value="${esc(d.email)}" /></div>
            <div class="field"><label>Phone</label><input data-k="phone" value="${esc(d.phone)}" /></div>
            <div class="field"><label>Location</label><input data-k="location" value="${esc(d.location)}" /></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Social Links</div>
          <div class="grid-2">
            <div class="field"><label>LinkedIn</label><input data-sk="linkedin" value="${esc(s.linkedin)}" /></div>
            <div class="field"><label>Instagram</label><input data-sk="instagram" value="${esc(s.instagram)}" /></div>
            <div class="field"><label>Behance</label><input data-sk="behance" value="${esc(s.behance)}" /></div>
            <div class="field"><label>YouTube</label><input data-sk="youtube" value="${esc(s.youtube)}" /></div>
            <div class="field"><label>Pinterest</label><input data-sk="pinterest" value="${esc(s.pinterest)}" /></div>
          </div>
        </div>`;
    }

    function bindProfile() {
      document.querySelectorAll("[data-k]").forEach(el => {
        el.oninput = () => { rawData[el.dataset.k] = el.value; markDirty(); };
      });
      document.querySelectorAll("[data-sk]").forEach(el => {
        el.oninput = () => {
          if (!rawData.socials) rawData.socials = {};
          rawData.socials[el.dataset.sk] = el.value;
          markDirty();
        };
      });
    }

    function renderSoftwares() {
      const list = Array.isArray(rawData) ? rawData : [];
      if (!list.length) return `<div class="card empty">No softwares yet. Click “Add Software”.</div>`;
      return list.map((item, i) => `
        <div class="item" data-i="${i}">
          <div class="item-head">
            <div>
              <div class="item-title">${esc(item.name)} <span class="badge">${esc(item.icon)}</span></div>
              <div class="item-meta">Level: ${item.level || 0}%</div>
              <div class="level-bar"><div class="level-fill" style="width:${item.level || 0}%"></div></div>
            </div>
            <div class="item-actions">
              <button class="btn ghost sm" data-edit="${i}">Edit</button>
              <button class="btn danger sm" data-del="${i}">Remove</button>
            </div>
          </div>
          <div class="edit-form" id="edit-${i}" style="display:none">
            <div class="grid-3">
              <div class="field"><label>Name</label><input data-f="name" value="${esc(item.name)}" /></div>
              <div class="field"><label>Icon</label><input data-f="icon" value="${esc(item.icon)}" /></div>
              <div class="field"><label>Level (0-100)</label><input type="number" min="0" max="100" data-f="level" value="${item.level || 0}" /></div>
            </div>
            <button class="btn primary sm" data-save="${i}">Save</button>
          </div>
        </div>`).join("");
    }

    function bindList(type) {
      document.querySelectorAll("[data-edit]").forEach(b => {
        b.onclick = () => {
          const form = document.getElementById("edit-" + b.dataset.edit);
          form.style.display = form.style.display === "none" ? "block" : "none";
        };
      });
      document.querySelectorAll("[data-del]").forEach(b => {
        b.onclick = () => {
          if (!confirm("Remove this item?")) return;
          rawData.splice(+b.dataset.del, 1);
          markDirty();
          render();
        };
      });
      document.querySelectorAll("[data-save]").forEach(b => {
        b.onclick = () => {
          const i = +b.dataset.save;
          const form = document.getElementById("edit-" + i);
          const obj = {};
          form.querySelectorAll("[data-f]").forEach(inp => {
            let v = inp.value;
            if (inp.type === "number") v = Number(v);
            obj[inp.dataset.f] = v;
          });
          // special for points
          if (type === "experience") {
            obj.points = [];
            form.querySelectorAll("[data-point]").forEach(inp => {
              if (inp.value.trim()) obj.points.push(inp.value.trim());
            });
            obj.id = rawData[i].id || Date.now();
            obj.logo = rawData[i].logo || null;
          }
          if (type === "projects") {
            obj.id = rawData[i].id || Date.now();
          }
          if (type === "categories") {
            obj.id = obj.id || rawData[i].id;
          }
          rawData[i] = { ...rawData[i], ...obj };
          markDirty();
          render();
        };
      });
    }

    function renderExperience() {
      const list = Array.isArray(rawData) ? rawData : [];
      if (!list.length) return `<div class="card empty">No experience yet. Click “Add Experience”.</div>`;
      return list.map((item, i) => `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${esc(item.role)}</div>
              <div class="item-meta">${esc(item.company)} · ${esc(item.period)}</div>
            </div>
            <div class="item-actions">
              <button class="btn ghost sm" data-edit="${i}">Edit</button>
              <button class="btn danger sm" data-del="${i}">Remove</button>
            </div>
          </div>
          <div class="edit-form" id="edit-${i}" style="display:none">
            <div class="grid-2">
              <div class="field"><label>Company</label><input data-f="company" value="${esc(item.company)}" /></div>
              <div class="field"><label>Role</label><input data-f="role" value="${esc(item.role)}" /></div>
              <div class="field"><label>Period</label><input data-f="period" value="${esc(item.period)}" /></div>
            </div>
            <div class="field"><label>Bullet Points</label>
              <div class="points">
                ${(item.points || []).map((p, pi) => `
                  <div class="point-row">
                    <input data-point value="${esc(p)}" />
                    <button class="btn danger sm" onclick="this.parentElement.remove()">×</button>
                  </div>`).join("")}
              </div>
              <button class="btn ghost sm" style="margin-top:6px" onclick="
                const d=this.previousElementSibling;
                const r=document.createElement('div'); r.className='point-row';
                r.innerHTML='<input data-point /><button class=\\'btn danger sm\\' onclick=\\'this.parentElement.remove()\\'>×</button>';
                d.appendChild(r);
              ">+ Add Point</button>
            </div>
            <button class="btn primary sm" data-save="${i}" style="margin-top:10px">Save</button>
          </div>
        </div>`).join("");
    }

    function renderEducation() {
      const list = Array.isArray(rawData) ? rawData : [];
      if (!list.length) return `<div class="card empty">No education yet.</div>`;
      return list.map((item, i) => `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${esc(item.title)}</div>
              <div class="item-meta">${esc(item.institution)} · ${esc(item.year)}</div>
            </div>
            <div class="item-actions">
              <button class="btn ghost sm" data-edit="${i}">Edit</button>
              <button class="btn danger sm" data-del="${i}">Remove</button>
            </div>
          </div>
          <div class="edit-form" id="edit-${i}" style="display:none">
            <div class="grid-3">
              <div class="field"><label>Year</label><input data-f="year" value="${esc(item.year)}" /></div>
              <div class="field"><label>Title</label><input data-f="title" value="${esc(item.title)}" /></div>
              <div class="field"><label>Institution</label><input data-f="institution" value="${esc(item.institution)}" /></div>
            </div>
            <button class="btn primary sm" data-save="${i}">Save</button>
          </div>
        </div>`).join("");
    }

    function renderCategories() {
      const list = Array.isArray(rawData) ? rawData : [];
      if (!list.length) return `<div class="card empty">No categories yet.</div>`;
      return list.map((item, i) => `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${esc(item.name)}</div>
              <div class="item-meta">ID: ${esc(item.id)}</div>
            </div>
            <div class="item-actions">
              <button class="btn ghost sm" data-edit="${i}">Edit</button>
              <button class="btn danger sm" data-del="${i}">Remove</button>
            </div>
          </div>
          <div class="edit-form" id="edit-${i}" style="display:none">
            <div class="grid-2">
              <div class="field"><label>ID (slug)</label><input data-f="id" value="${esc(item.id)}" /></div>
              <div class="field"><label>Name</label><input data-f="name" value="${esc(item.name)}" /></div>
            </div>
            <button class="btn primary sm" data-save="${i}">Save</button>
          </div>
        </div>`).join("");
    }

    function renderProjects() {
      const list = Array.isArray(rawData) ? rawData : [];
      if (!list.length) return `<div class="card empty">No projects yet.</div>`;
      return list.map((item, i) => `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${esc(item.title)}</div>
              <div class="item-meta">${esc(item.client)} · <span class="badge">${esc(item.category)}</span> · ${esc(item.tag)}</div>
            </div>
            <div class="item-actions">
              <button class="btn ghost sm" data-edit="${i}">Edit</button>
              <button class="btn danger sm" data-del="${i}">Remove</button>
            </div>
          </div>
          <div class="edit-form" id="edit-${i}" style="display:none">
            <div class="grid-2">
              <div class="field"><label>Title</label><input data-f="title" value="${esc(item.title)}" /></div>
              <div class="field"><label>Client</label><input data-f="client" value="${esc(item.client)}" /></div>
              <div class="field"><label>Category ID</label><input data-f="category" value="${esc(item.category)}" /></div>
              <div class="field"><label>Tag</label><input data-f="tag" value="${esc(item.tag)}" /></div>
            </div>
            <button class="btn primary sm" data-save="${i}">Save</button>
          </div>
        </div>`).join("");
    }

    function addItem() {
      if (!Array.isArray(rawData)) rawData = [];
      if (activeId === "softwares") {
        rawData.push({ name: "New Software", icon: "New", level: 50 });
      } else if (activeId === "experience") {
        rawData.push({ id: Date.now(), company: "Company", role: "Role", period: "2024 – Present", logo: null, points: ["Point 1"] });
      } else if (activeId === "education") {
        rawData.push({ year: "2024", title: "Degree", institution: "University" });
      } else if (activeId === "categories") {
        rawData.push({ id: "new-cat", name: "New Category" });
      } else if (activeId === "projects") {
        rawData.push({ id: Date.now(), title: "New Project", category: "other", client: "Client", tag: "Tag" });
      }
      markDirty();
      render();
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render() {
      const sec = SECTIONS.find(s => s.id === activeId);
      let body = "";
      let addLabel = "";

      if (activeId === "profile") {
        body = renderProfile();
      } else if (activeId === "softwares") {
        body = renderSoftwares();
        addLabel = "Add Software";
      } else if (activeId === "experience") {
        body = renderExperience();
        addLabel = "Add Experience";
      } else if (activeId === "education") {
        body = renderEducation();
        addLabel = "Add Education";
      } else if (activeId === "categories") {
        body = renderCategories();
        addLabel = "Add Category";
      } else if (activeId === "projects") {
        body = renderProjects();
        addLabel = "Add Project";
      }

      root.innerHTML = `
        <div class="app">
          <aside class="side">
            <div class="brand">Portfolio <span>CMS</span></div>
            <nav class="nav">
              <div class="group">Content</div>
              ${SECTIONS.map(s => `
                <button type="button" class="${s.id === activeId ? "active" : ""}" data-sec="${s.id}">
                  <span class="icon">${s.icon}</span> ${s.name}
                </button>`).join("")}
            </nav>
            <div class="side-footer">
              <button type="button" id="logout" class="btn ghost" style="width:100%;color:#fca5a5">Logout</button>
            </div>
          </aside>
          <main class="main">
            <div class="topbar">
              <div>
                <h1>${sec.name}</h1>
                <p class="sub">${activeId === "profile" ? "Edit profile details" : "Add, edit or remove items"}</p>
              </div>
              <div class="top-actions">
                ${addLabel ? `<button class="btn ghost" id="addBtn">+ ${addLabel}</button>` : ""}
                <a class="btn ghost" href="/" target="_blank">Preview Site</a>
                <button class="btn primary" id="publish">Publish Changes</button>
              </div>
            </div>
            ${body}
            <div id="status" class="status">Ready</div>
          </main>
        </div>`;

      // Bind nav
      document.querySelectorAll("[data-sec]").forEach(b => {
        b.onclick = () => {
          if (dirty && !confirm("You have unsaved changes. Discard and switch?")) return;
          loadSection(b.dataset.sec);
        };
      });
      document.getElementById("publish").onclick = saveSection;
      document.getElementById("logout").onclick = async () => {
        try { await fetch("/api/admin/logout", { method: "POST", credentials: "include" }); } catch {}
        showLogin();
      };
      const addBtn = document.getElementById("addBtn");
      if (addBtn) addBtn.onclick = addItem;

      if (activeId === "profile") bindProfile();
      else bindList(activeId);
    }

    async function start() {
      try {
        await api("/api/admin/content?path=" + encodeURIComponent(SECTIONS[0].path));
        await loadSection("profile");
      } catch {
        showLogin();
      }
    }
    start();
  </script>
</body>
</html>
