<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ai-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC14D"/>
      <stop offset="0.45" stop-color="#FF9A00"/>
      <stop offset="1" stop-color="#C45A00"/>
    </linearGradient>
    <linearGradient id="ai-shine" x1="12" y1="6" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ai-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4A2000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#ai-bg)" filter="url(#ai-shadow)"/>
  <rect x="4" y="4" width="56" height="28" rx="14" fill="url(#ai-shine)"/>
  <text x="32" y="40" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="22" fill="#3D1500">Ai</text>
</svg>
