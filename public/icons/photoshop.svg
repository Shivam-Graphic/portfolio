      <stop stop-color="#5EC8FF"/>
      <stop offset="0.45" stop-color="#31A8FF"/>
      <stop offset="1" stop-color="#0D6EAE"/>
    </linearGradient>
    <linearGradient id="ps-shine" x1="12" y1="6" x2="40" y2="36" gradientUnits="userSpaceOnUse">
